<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exponentielles Wachstum – Mini-Challenge</title>
<style>
  :root {
    --ink: #19334b;
    --muted: #64778a;
    --blue: #315fce;
    --line: #dce5ef;
    --green: #18794e;
    --red: #b42318;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 22px 14px;
    display: grid;
    place-items: center;
    background: linear-gradient(145deg, #eaf1ff, #f5fbff 55%, #e8f7f1);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .game {
    width: min(100%, 620px);
    padding: clamp(22px, 5vw, 38px);
    background: white;
    border: 1px solid #e7edf5;
    border-radius: 24px;
    box-shadow: 0 18px 50px #193c6418;
  }
  .top, .bottom, .progress-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .badge {
    padding: 7px 12px;
    border-radius: 99px;
    background: #eef3ff;
    color: var(--blue);
    font-size: .85rem;
    font-weight: 750;
  }
  .score, .streak, .progress-label {
    color: var(--muted);
    font-size: .9rem;
    font-weight: 650;
  }
  h1 { margin: 18px 0 4px; font-size: clamp(1.9rem, 7vw, 2.7rem); letter-spacing: -1.3px; }
  .intro { margin: 0; color: var(--muted); }
  .progress { margin: 24px 0; }
  .progress-label { margin-bottom: 8px; }
  .track { height: 9px; overflow: hidden; border-radius: 99px; background: #edf1f6; }
  .bar { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #315fce, #35b892); transition: width .25s; }
  .prompt { margin: 20px 0 9px; color: var(--muted); font-weight: 650; }
  .task {
    min-height: 100px;
    display: grid;
    place-items: center;
    padding: 18px;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: #fbfdff;
    text-align: center;
    white-space: pre-line;
    font-size: clamp(1.25rem, 5vw, 1.8rem);
    font-weight: 750;
    line-height: 1.5;
  }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; margin-top: 17px; }
  button { font: inherit; }
  .choice {
    min-height: 56px;
    padding: 11px 8px;
    border: 2px solid var(--line);
    border-radius: 14px;
    background: white;
    color: var(--ink);
    cursor: pointer;
    font-size: 1.03rem;
    font-weight: 700;
  }
  .choice:hover:not(:disabled) { border-color: #91b1ef; background: #f7faff; }
  .choice:focus-visible, .primary:focus-visible { outline: 3px solid #88adff; outline-offset: 3px; }
  .choice:disabled { cursor: default; }
  .choice.correct { border-color: #53b487; background: #eaf8f0; color: var(--green); }
  .choice.wrong { border-color: #e39a94; background: #fff0ee; color: var(--red); }
  .feedback { min-height: 48px; margin: 14px 2px 0; color: var(--muted); line-height: 1.45; }
  .feedback.good { color: var(--green); }
  .feedback.bad { color: var(--red); }
  .primary {
    padding: 11px 16px;
    border: 0;
    border-radius: 12px;
    background: var(--blue);
    color: white;
    font-weight: 750;
    cursor: pointer;
  }
  .primary:hover { background: #234bab; }
  .finished { padding: 20px 4px 6px; text-align: center; }
  .finished .emoji { font-size: 3rem; }
  .finished h2 { margin: 8px 0; font-size: 1.8rem; }
  .finished p { color: var(--muted); line-height: 1.5; }
  @media (max-width: 420px) {
    .choices { grid-template-columns: 1fr; gap: 8px; }
    .choice { min-height: 49px; }
  }
</style>
</head>
<body>
<main class="game">
  <div class="top">
    <span class="badge">🌱 Mathe-Mini-Spiel</span>
    <span class="score" id="score">Punkte: 0</span>
  </div>
  <h1>Exponentielles Wachstum</h1>
  <p class="intro">Knacke die Aufgaben – und lass deine Punktzahl wachsen!</p>

  <section id="play">
    <div class="progress">
      <div class="progress-label">
        <span id="round">Aufgabe 1 von 10</span>
        <span id="category">Wachstumsfaktor</span>
      </div>
      <div class="track"><div class="bar" id="bar"></div></div>
    </div>

    <p class="prompt" id="prompt"></p>
    <div class="task" id="task"></div>
    <div class="choices" id="choices"></div>
    <p class="feedback" id="feedback" aria-live="polite">Wähle die richtige Antwort aus.</p>
    <div class="bottom">
      <span class="streak" id="streak">🔥 Serie: 0</span>
      <button class="primary" id="next" hidden>Nächste Aufgabe →</button>
    </div>
  </section>

  <section class="finished" id="finished" hidden></section>
</main>

<script>
(() => {
  const total = 10;
  let questionNo = 0;
  let score = 0;
  let streak = 0;
  let correctAnswer = "";

  const $ = id => document.getElementById(id);
  const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
  const pick = items => items[Math.floor(Math.random() * items.length)];
  const shuffle = items => items.sort(() => Math.random() - 0.5);

  function makeOptions(answer, candidates) {
    const options = [...new Set([String(answer), ...candidates.map(String)])];
    while (options.length < 4) {
      const extra = String(rand(2, 40));
      if (!options.includes(extra)) options.push(extra);
    }
    return shuffle(options.slice(0, 4));
  }

  function makeQuestion() {
    const kind = rand(0, 3);

    if (kind === 0) {
      const start = rand(3, 15);
      const factor = pick([2, 3]);
      const time = rand(1, 4);
      const answer = start * Math.pow(factor, time);
      return {
        category: "Wachstum berechnen",
        prompt: "Wie groß ist der Bestand nach der angegebenen Zeit?",
        task: `N(t) = ${start} · ${factor}ᵗ\nGesucht: N(${time})`,
        answer,
        options: makeOptions(answer, [
          start * factor * time,
          start * Math.pow(factor, time - 1),
          start + factor * time
        ])
      };
    }

    if (kind === 1) {
      const start = rand(4, 20);
      const factor = pick([2, 3, 4]);
      return {
        category: "Wachstumsfaktor",
        prompt: "Bestimme den Wachstumsfaktor pro Zeitschritt.",
        task: `Zu Beginn: ${start}\nNach einem Zeitschritt: ${start * factor}`,
        answer: factor,
        options: makeOptions(factor, [factor + 1, factor - 1, start])
      };
    }

    if (kind === 2) {
      const start = rand(5, 30);
      const factor = pick([2, 3]);
      const time = rand(2, 4);
      return {
        category: "Anfangsbestand",
        prompt: "Wie groß war der Bestand zu Beginn, also bei t = 0?",
        task: `N(t) = ${start} · ${factor}ᵗ\nGesucht: N(0)`,
        answer: start,
        options: makeOptions(start, [
          start * factor,
          start + factor,
          start * Math.pow(factor, time)
        ])
      };
    }

    const factor = pick([1.1, 1.2, 1.5]);
    const percent = Math.round((factor - 1) * 100);
    return {
      category: "Prozentuales Wachstum",
      prompt: "Um wie viel Prozent wächst der Bestand pro Zeitschritt?",
      task: `Wachstumsfaktor: ${factor.toLocaleString("de-DE")}`,
      answer: `${percent} %`,
      options: makeOptions(`${percent} %`, [
        `${Math.round(factor * 100)} %`,
        `${Math.round((factor - 1) * 10)} %`,
        `${Math.round((factor + 1) * 100)} %`
      ])
    };
  }

  function showQuestion() {
    if (questionNo >= total) return finish();

    const q = makeQuestion();
    correctAnswer = String(q.answer);
    $("round").textContent = `Aufgabe ${questionNo + 1} von ${total}`;
    $("category").textContent = q.category;
    $("bar").style.width = `${questionNo / total * 100}%`;
    $("prompt").textContent = q.prompt;
    $("task").textContent = q.task;
    $("feedback").textContent = "Wähle die richtige Antwort aus.";
    $("feedback").className = "feedback";
    $("next").hidden = true;
    $("choices").replaceChildren();

    q.options.forEach(option => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "choice";
      button.textContent = option;
      button.addEventListener("click", () => checkAnswer(button, option));
      $("choices").appendChild(button);
    });
  }

  function checkAnswer(button, choice) {
    const buttons = [...$("choices").children];
    buttons.forEach(item => item.disabled = true);

    if (String(choice) === correctAnswer) {
      button.classList.add("correct");
      score++;
      streak++;
      $("feedback").textContent = pick([
        "Richtig! Der Bestand wächst exponentiell. ✨",
        "Genau – stark gerechnet! 🎯",
        "Stimmt! Weiter so. 🚀"
      ]);
      $("feedback").className = "feedback good";
    } else {
      button.classList.add("wrong");
      streak = 0;
      const correctButton = buttons.find(item => item.textContent === correctAnswer);
      if (correctButton) correctButton.classList.add("correct");
      $("feedback").textContent = `Knapp daneben. Die richtige Antwort ist ${correctAnswer}.`;
      $("feedback").className = "feedback bad";
    }

    $("score").textContent = `Punkte: ${score}`;
    $("streak").textContent = `🔥 Serie: ${streak}`;
    questionNo++;
    $("bar").style.width = `${questionNo / total * 100}%`;
    $("next").hidden = false;
    $("next").textContent = questionNo === total ? "Ergebnis ansehen" : "Nächste Aufgabe →";
  }

  function finish() {
    $("play").hidden = true;
    $("finished").hidden = false;

    const message = score === total
      ? "Perfekt – du bist ein Wachstums-Profi!"
      : score >= 7
        ? "Richtig stark! Die Grundlagen sitzen."
        : score >= 4
          ? "Guter Anfang – mit etwas Übung wächst deine Sicherheit."
          : "Weiterüben lohnt sich – du schaffst das!";

    $("finished").innerHTML = `
      <div class="emoji">${score === total ? "🏆" : score >= 7 ? "🌟" : "💪"}</div>
      <h2>Runde geschafft!</h2>
      <p><strong>${score} von ${total} Punkten</strong><br>${message}</p>
      <button class="primary" id="again">Nochmal spielen</button>`;
    $("again").addEventListener("click", restart);
  }

  function restart() {
    questionNo = 0;
    score = 0;
    streak = 0;
    $("score").textContent = "Punkte: 0";
    $("streak").textContent = "🔥 Serie: 0";
    $("play").hidden = false;
    $("finished").hidden = true;
    showQuestion();
  }

  $("next").addEventListener("click", showQuestion);
  showQuestion();
})();
</script>
</body>
</html>
