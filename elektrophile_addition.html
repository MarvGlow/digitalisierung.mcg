<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Elektrophile Addition</title>
<style>
:root{--bg:#eef3f6;--c:#fff;--t:#16262e;--m:#51646e;--a:#1d4fd7;--ok:#1f7a3a;--no:#b3261e;--b:#c3d0d7;--br:#8a3a12;--grid:rgba(29,79,215,.08);--sel:rgba(29,79,215,.09)}
@media(prefers-color-scheme:dark){:root{--bg:#0e151a;--c:#17212a;--t:#e5edf2;--m:#9fb0ba;--a:#8fb4ff;--ok:#7bd08f;--no:#ff9a91;--b:#33444f;--br:#f0a26b;--grid:rgba(143,180,255,.09);--sel:rgba(143,180,255,.12)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:17px/1.55 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
main{max-width:880px;margin:auto;padding:16px 14px 24px}
h1{font-size:1.6rem;line-height:1.2;margin:.1em 0 .1em}
.sub{margin:0 0 14px;color:var(--m)}
button{font:inherit;color:inherit;background:var(--c);border:1.5px solid var(--b);border-radius:8px;padding:10px 14px;min-height:44px;cursor:pointer;text-align:left;touch-action:manipulation}
button:hover:not(:disabled){border-color:var(--a)}
button:focus-visible{outline:3px solid var(--a);outline-offset:2px}
button:disabled{cursor:default;opacity:.6}
#nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-bottom:14px}
.tab{display:flex;flex-direction:column;gap:2px;padding:10px 14px}
.tab small{color:var(--m);font-size:.82rem;line-height:1.3}
.tab.on{border-color:var(--a);background:var(--sel);box-shadow:inset 0 -4px 0 var(--a)}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.opt.on{border-color:var(--a);background:var(--sel);box-shadow:inset 0 -4px 0 var(--a)}
.opt.sel{border-color:var(--a);background:var(--sel);box-shadow:inset 0 -4px 0 var(--a)}
.opt.ok,.opt.ok:disabled{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--c));opacity:1}
.opt.term{font-weight:bold}
.eq{padding:10px 14px;margin:0 0 12px;background:var(--c);border-left:5px solid var(--a);border-radius:0 8px 8px 0;font-size:1.1rem}
.lead{margin:6px 0 12px}
.g{display:grid;grid-template-columns:1fr 1.7fr;gap:10px}
.g>div,.pool{display:flex;flex-direction:column;gap:8px}
.pool{margin-bottom:12px}
.fig{background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/24px 24px,var(--c);border:1.5px solid var(--b);border-radius:8px;padding:4px}
.fig[hidden]{display:none}
.fig svg{display:block;width:100%;height:auto;max-width:640px;margin:auto}
.steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
.step{display:grid;grid-template-columns:34px 1fr;gap:10px}
.step p{margin:0 0 6px}
.n{width:34px;height:34px;border-radius:50%;background:var(--a);color:var(--c);display:flex;align-items:center;justify-content:center;font-weight:bold}
.card{background:var(--c);border:1.5px solid var(--b);border-radius:10px;padding:14px}
.qt{font-size:1.12rem;font-weight:bold;margin:8px 0 12px}
.dots{display:flex;gap:6px}.dots span{width:26px;height:6px;border-radius:3px;background:var(--b)}
.dots .on{background:var(--ok)}.dots .cur{background:var(--a)}
.card .fig{margin-bottom:12px}
.card h2{margin:0 0 6px;font-size:1.2rem}
#f{position:sticky;bottom:10px;margin:14px 0 0;padding:10px 14px;background:var(--c);border:1.5px solid var(--b);border-left-width:6px;border-radius:8px;font-weight:bold;max-height:40vh;overflow:auto}
#f:empty{display:none}
#f.bad{border-left-color:var(--no)}#f.good{border-left-color:var(--ok)}
/* Zeichnung */
svg text{font-family:Arial,Helvetica,sans-serif}
.at{fill:var(--t)}.br{fill:var(--br);font-weight:bold}.cap,.dl{fill:var(--m);font-style:italic}
.bd{stroke:var(--t);stroke-width:3;stroke-linecap:round}
.lp{stroke:var(--t);stroke-width:2.6;stroke-linecap:round}
.cc{fill:var(--c);stroke:var(--t);stroke-width:2}.cs{stroke:var(--t);stroke-width:2.2;stroke-linecap:round}
.ar{fill:none;stroke:var(--a);stroke-width:3;stroke-linecap:round}.arh{fill:var(--a)}.num{fill:var(--a);font-weight:bold}
@keyframes fi{from{opacity:0}to{opacity:1}}
.rv .arw{animation:fi .6s ease-out}
@media(prefers-reduced-motion:reduce){.rv .arw{animation:none}}
@media(max-width:600px){.g{grid-template-columns:1fr}}
</style></head><body><main>

['induzierter Dipol','Durch die Elektronen der C=C-Bindung verursachte Ladungsverschiebung in einem unpolaren Molekül','Br₂ ist unpolar. Die Polarisierung entsteht erst durch die Nähe der Doppelbindung.'],

['Das Elektronenpaar der C=C-Bindung greift das Brδ⁺ an, die Br–Br-Bindung wird heterolytisch gespalten','Erst muss das Br₂ polarisiert sein, sonst gibt es kein Elektrophil.'],
['Es entstehen ein Carbokation (C⁺) und ein Bromid-Ion (Br⁻)','Zuerst muss das Elektrophil angegriffen und die Bindung gespalten worden sein.'],

['Es entstehen ein Carbokation (CH₃–CH₂⁺) und ein Bromid-Ion (Br⁻)','Zuerst muss das Elektrophil angegriffen und die Bindung gespalten worden sein.'],

['Produkt: Bromethan','Das Produkt steht am Ende, nach dem Angriff des Nucleophils.']]};
const Q={ // Frage, Optionen, richtig, Erklärung, Hinweis
A:[['Warum wird das unpolare Br₂ in der Nähe von Ethen polar?',['Die Elektronen der C=C-Bindung stoßen die Elektronen im Br₂ ab (induzierter Dipol)','Br₂ ist immer polar','Ethen ist positiv geladen'],0,'Die Doppelbindung hat hohe Elektronendichte. Sie verschiebt die Elektronen im Br₂: das nähere Br wird δ⁺, das ferne δ⁻.','Br₂ besteht aus zwei gleichen Atomen, daher ist es ohne äußeren Einfluss unpolar.'],
['Wohin zeigt der erste Elektronenpfeil?',['Vom Brδ⁺ zur C=C-Bindung','Vom Elektronenpaar der C=C-Bindung zum Brδ⁺','Vom C-Atom zum Brδ⁻'],1,'Elektronenpfeile zeigen die Bewegung von Elektronenpaaren: Sie starten am Elektronenpaar (C=C) und enden am Elektrophil (Brδ⁺).','Ein Pfeil startet immer an einem Elektronenpaar, nicht an einem Atom oder einer Teilladung.'],
['Was passiert mit dem Bindungselektronenpaar der Br–Br-Bindung?',['Es bleibt gleichmäßig verteilt','Es geht vollständig an das Br⁻-Ende (heterolytische Spaltung)','Jedes Br bekommt ein Elektron'],1,'Das Paar wandert zum δ⁻-Br, dadurch entsteht ein Bromid-Ion.','Jedes Br bekommt ein Elektron ist die homolytische Spaltung (Radikale).'],
['Welche Ladung hat die Zwischenstufe und warum?',['Negativ: ein C-Atom hat ein Elektronenpaar zu viel','Positiv: einem C-Atom fehlt ein Bindungspartner (Carbokation)','Neutral: es entsteht ein Radikal'],1,'Das C-Atom hat sein Elektronenpaar für die Bindung zum Br abgegeben und trägt nun eine positive Ladung.','Das Elektronenpaar der Doppelbindung wurde zum Br hin verwendet, das andere C hat also zu wenig Elektronen.'],
['Wie beginnt der letzte Elektronenpfeil?',['Am freien Elektronenpaar des Br⁻','Am positiven C-Atom','Am Brom-Atom des Produkts'],0,'Das Nucleophil gibt ein freies Elektronenpaar an das positivierte C-Atom ab.','Der Pfeil startet beim Nucleophil, das Elektronen mitbringt.'],

['Welche Aussage über die beiden Brom-Atome im Mechanismus ist richtig?',['Beide Br-Atome binden im selben Moment an die beiden C-Atome','Das Br-Atom, das zuerst gebunden wird, wirkt als Elektrophil; das zweite bindet danach als Bromid-Ion (Nucleophil)','Das Bromid-Ion greift zuerst an, danach das Brδ⁺','Beide Br-Atome werden als Radikale gebunden'],1,'Zuerst bindet das Brδ⁺ unter Bildung des Carbokations, danach greift das bei der Heterolyse entstandene Br⁻ an. Die Addition verläuft also in zwei Schritten.','Die Addition läuft über eine Zwischenstufe. Überlege, was zwischen den beiden Bindungsbildungen passiert.']],

['Welche Ladung hat die Zwischenstufe CH₃–CH₂⁺ und warum?',['Negativ: ein C-Atom hat ein Elektronenpaar zu viel','Positiv: einem C-Atom fehlt ein Bindungspartner (Carbokation)','Neutral: es entsteht ein Radikal'],1,'Das Elektronenpaar der Doppelbindung wurde zum H hin verwendet, dem anderen C-Atom fehlt es nun.','Bedenke, wohin das Elektronenpaar der Doppelbindung gewandert ist.'],

const LP=(x,y,s)=>(s.includes('t')?L(x-7,y-24,x+7,y-24,'lp'):'')+(s.includes('b')?L(x-7,y+24,x+7,y+24,'lp'):'')+(s.includes('l')?L(x-27,y-7,x-27,y+7,'lp'):'')+(s.includes('r')?L(x+27,y-7,x+27,y+7,'lp'):'');

const BR=(x,y)=>X(x,y,'Br','br');
