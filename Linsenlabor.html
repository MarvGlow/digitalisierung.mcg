<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Linsenlabor – Linsen und Bildentstehung</title>
<style>
:root{--bg:#eef3f8;--panel:#fff;--ink:#1f2d3d;--muted:#5b6b7c;--accent:#2563eb;--good:#15803d;--bad:#b91c1c;--gold:#f5b301;--line:#d8e0ea}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-user-select:none;user-select:none;font-size:15px}
button{font:inherit;touch-action:manipulation;cursor:pointer;color:inherit}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;padding-top:max(8px,env(safe-area-inset-top));background:#1e3a5f;color:#fff;flex:0 0 auto;flex-wrap:wrap}
.brand{font-weight:800;font-size:20px;white-space:nowrap}
.brand small{font-weight:500;opacity:.75;font-size:13px;margin-left:6px}
.tabs{display:flex;gap:6px;margin-left:auto}
.tab{border:0;border-radius:10px;padding:9px 16px;background:rgba(255,255,255,.14);color:#fff;font-weight:700;min-height:44px}
.tab.active{background:#fff;color:#1e3a5f}
.startotal{font-weight:800;background:rgba(255,255,255,.14);padding:10px 12px;border-radius:10px;white-space:nowrap}
main{flex:1;display:flex;min-height:0}
#stageWrap{flex:1;position:relative;min-width:0;min-height:0}
#stage{position:absolute;inset:0;touch-action:none;display:block}
#panel > :last-child{margin-bottom:28px}
#panel{width:360px;flex:0 0 360px;background:var(--panel);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 0;border-left:1px solid var(--line)}
@media (max-width:820px){.brand small{display:none}.brand{font-size:18px}.tab{padding:9px 10px}}
@media (max-width:900px),(orientation:portrait){main{flex-direction:column}#panel{width:auto;flex:0 0 46%;border-left:0;border-top:1px solid var(--line)}}
h2{font-size:19px;margin:6px 0 8px}
h3{font-size:14px;margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
p{margin:6px 0;line-height:1.4}
.small{font-size:13px;color:var(--muted);line-height:1.35}
.context{background:#e8f1fd;border-left:4px solid var(--accent);padding:9px 11px;border-radius:8px;margin:8px 0;line-height:1.4}
.task{background:#fff7e0;border-left:4px solid var(--gold);padding:9px 11px;border-radius:8px;margin:8px 0;line-height:1.4}
.btn{border:1px solid #c5d0dd;background:#f4f7fb;border-radius:10px;padding:9px 12px;min-height:44px;font-weight:600}
.btn.on{background:#1e3a5f;color:#fff;border-color:#1e3a5f}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);width:100%;margin-top:10px;font-size:16px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.row .btn{flex:1 1 auto}
.seg{display:flex;border:1px solid #c5d0dd;border-radius:10px;overflow:hidden;margin:4px 0 8px}
.seg button{flex:1;border:0;border-right:1px solid #c5d0dd;background:#f4f7fb;padding:9px 4px;min-height:44px;font-weight:600;font-size:14px}
.seg button:last-child{border-right:0}
.seg button.on{background:#1e3a5f;color:#fff}
.assign .seg button{font-size:13px;line-height:1.15;-webkit-hyphens:manual;hyphens:manual;padding:6px 3px}
.seg button.right{background:#dcfce7;color:#14532d}
.seg button.right.on{background:var(--good);color:#fff}
.seg button.wrongsel{background:#fee2e2;color:#7f1d1d}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid #c5d0dd;background:#fff;border-radius:999px;padding:7px 12px;min-height:40px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
.chip .dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.chip.on{background:#1e3a5f;color:#fff;border-color:#1e3a5f}
.slider{display:flex;align-items:center;gap:10px;margin:4px 0}
.slider input{flex:1;height:36px}
.slider output{min-width:66px;text-align:right;font-weight:700}
table.meas{width:100%;border-collapse:collapse;font-size:14px}
table.meas td{padding:5px 4px;border-bottom:1px solid #edf1f6}
table.meas td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{background:#e0e7ff;color:#1e3a8a;border-radius:999px;padding:4px 10px;font-weight:700;font-size:13px}
.tag.warn{background:#fef3c7;color:#78350f}
.scr{margin-top:6px}
.scrbox{border:2px solid #90a4ae;border-radius:8px;overflow:hidden;background:#f5f5f0;height:150px;position:relative}
#scrView{width:100%;height:100%;display:block}
.feedback{margin:10px 0;padding:10px 12px;border-radius:8px;line-height:1.4;display:none}
.feedback.show{display:block}
.feedback.good{background:#dcfce7;color:#14532d}
.feedback.bad{background:#fee2e2;color:#7f1d1d}
.feedback.info{background:#e0f2fe;color:#0c4a6e}
.hints{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
/* Aktionsleiste klebt unten im Panel: Prüfen und Hinweis sind immer sichtbar */
.actions{position:sticky;bottom:0;margin:12px -14px 0 !important;padding:10px 14px max(12px,env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 12px rgba(30,58,95,.08);z-index:2}
.actions .feedback{margin:0 0 8px;max-height:30vh;overflow-y:auto}
.actrow{display:flex;gap:8px}
.actrow .btn.primary{margin-top:0;flex:2}
.actrow .hintbtn{flex:1;white-space:nowrap}
.actions .starline{margin-top:6px}
details.howto{margin:4px 0}
details.howto summary{font-weight:700;font-size:14px;color:var(--accent);cursor:pointer;padding:6px 0;min-height:32px}
.hint{background:#f5f3ff;border-left:4px solid #7c3aed;padding:8px 10px;border-radius:8px;margin:6px 0;line-height:1.4}
.hint b{color:#5b21b6}
.starline{font-size:14px;color:var(--muted);margin-top:8px}
.starline .st{color:var(--gold);font-size:18px;letter-spacing:2px}
.starline .st i{color:#cfd8e3;font-style:normal}
.lvhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.assign{margin:8px 0}
.assign .badge{display:inline-flex;width:28px;height:28px;border-radius:50%;color:#fff;align-items:center;justify-content:center;font-weight:800;margin-bottom:2px}
.lbl{font-weight:700;font-size:14px;margin-top:8px}
.casebox{background:#f1f5f9;border-radius:8px;padding:8px 10px;font-weight:700;margin:8px 0}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.toolbar .btn{flex:1 1 30%;padding:8px 6px;font-size:14px}
#levelGrid{position:absolute;inset:0;background:rgba(238,243,248,.97);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px;display:none}
#levelGrid.show{display:block}
#levelGrid h2{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.card{border:0;text-align:left;background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 2px 6px rgba(30,58,95,.12);min-height:118px;display:flex;flex-direction:column;gap:4px}
.card .num{font-size:13px;font-weight:800;color:var(--accent)}
.card .ttl{font-weight:800;font-size:16px;line-height:1.2}
.card .ico{font-size:24px}
.card .st{color:var(--gold);font-size:18px;letter-spacing:2px;margin-top:auto}
.card .st i{color:#cfd8e3;font-style:normal}
.card.extra{background:#fdf4ff}
.card .xtra{font-size:12px;font-weight:800;color:#a21caf}
#overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
#overlay.show{display:flex}
.modal{background:#fff;border-radius:18px;max-width:440px;width:100%;padding:22px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.bigstars{font-size:50px;letter-spacing:6px;color:var(--gold)}
.bigstars i{color:#d8dee8;font-style:normal}
.bigstars span{display:inline-block;animation:pop .5s ease both}
.bigstars span:nth-child(2){animation-delay:.18s}.bigstars span:nth-child(3){animation-delay:.36s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.modal .row .btn{flex:1}
</style>
</head>
<body>
<header>
  <div class="brand">🔍 Linsenlabor <small>Linsen &amp; Bildentstehung</small></div>
  <nav class="tabs">
    <button id="tabExp" class="tab active" data-act="modeExp">🧪 Experimentieren</button>
    <button id="tabTask" class="tab" data-act="modeTask">⭐ Aufgaben</button>
  </nav>
  <div id="starTotal" class="startotal">⭐ 0 / 30</div>
</header>
<main>
  <div id="stageWrap">
    <canvas id="stage"></canvas>
    <div id="levelGrid"></div>
  </div>
  <aside id="panel"></aside>
</main>
<div id="overlay"><div class="modal" id="modal"></div></div>

<script>
'use strict';
/* =====================================================================
   Linsenlabor – interaktives Lernprogramm zu Linsen (Klasse 8/9)
   Aufbau:
   1. Hilfsfunktionen & Zustand
   2. Physik (dünne Linse, Hauptstrahlen)
   3. Zeichnen auf dem Canvas
   4. Bedienung (Ziehen, Strahlen zeichnen)
   5. Experimentiermodus (Panel)
   6. Aufgabenmodus (Level, Hinweise, Sterne)
   Einheiten: Alle Längen in cm, Linse sitzt bei x = 0, Achse bei y = 0.
   ===================================================================== */

/* ---------- 1. Hilfsfunktionen & Zustand ---------- */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = (v, d = 1) => (Math.round(v * 10 ** d) / 10 ** d).toFixed(d).replace('.', ',');
const norm = (x, y) => { const l = Math.hypot(x, y) || 1; return { x: x / l, y: y / l }; };
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const angDeg = (u, v) => Math.acos(clamp(u.x * v.x + u.y * v.y, -1, 1)) * 180 / Math.PI;
function distPointLine(p, a, d) { const n = norm(d.x, d.y); return Math.abs((p.x - a.x) * n.y - (p.y - a.y) * n.x); }
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

const cv = $('stage'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
const view = { k: 7, cx: 0, cy: 0 };
const X = x => view.cx + x * view.k, Y = y => view.cy - y * view.k;
const MAP = (x, y) => [X(x), Y(y)];

const A = 12;          // halbe Linsenhöhe
const SCREEN_H = 15;   // halbe Schirmhöhe
const COL = { par: '#e53935', cen: '#1565c0', foc: '#2e7d32', pencil: '#263238', ghost: '#8e24aa', bundle: 'rgba(255,160,0,0.55)' };
const NEUTRAL = ['#8e24aa', '#ef6c00', '#00838f'];
const NAME = { par: 'Parallelstrahl', cen: 'Mittelpunktstrahl', foc: 'Brennpunktstrahl' };

let S = defaultState();
function defaultState() {
  return {
    lensType: 'conv', f: 8, g: 20, G: 4, s: 30,
    showScreen: true, rays: { par: true, cen: true, foc: true }, bundle: false,
    showImage: true, showExt: true, showDims: true, showF: true, show2F: true,
    drag: { obj: true, objH: true, screen: true },
    construct: false, tool: 'pen', lines: [], imgMark: null,
    neutral: null, sun: false, xMin: -40, xMax: 40, screenLabel: 'Schirm'
  };
}

let mode = 'exp';      // 'exp' | 'task'
let cur = null;        // laufendes Level
const best = [];       // beste Sterne je Level (nur im Arbeitsspeicher)

/* ---------- 2. Physik ---------- */
// Vorzeichenbehaftete Brennweite: Sammellinse +f, Zerstreuungslinse −f
const fSigned = () => S.lensType === 'conv' ? S.f : -S.f;

// Linsengleichung 1/f = 1/g + 1/b  (b < 0: virtuelles Bild vor der Linse)
function image() {
  const f = fSigned(), g = S.g, G = S.G;
  if (Math.abs(g - f) < 0.05) return { inf: true };
  const b = 1 / (1 / f - 1 / g);
  return { inf: false, b, B: -b / g * G, real: b > 0 };
}

// Höhe, in der ein Hauptstrahl die Mittelebene der Linse trifft
function rayYL(type) {
  const f = fSigned(), g = S.g, G = S.G;
  if (type === 'par') return G;
  if (type === 'cen') return 0;
  if (Math.abs(g - f) < 0.05) return null;          // Brennpunktstrahl existiert nicht
  return G - g * G / (g - f);                       // Gerade durch Spitze und F (F liegt bei x = −f)
}

// Richtung nach der Linse: Alle Strahlen von der Spitze gehen durch den Bildpunkt (bzw. scheinen von ihm zu kommen)
function postDir(yL, im) {
  if (im.inf) return norm(S.g, -S.G);
  if (im.real) return norm(im.b, im.B - yL);
  return norm(-im.b, -(im.B - yL));
}

// Verlauf eines Strahls bis zum Schirm bzw. Bildrand
function rayPath(yL, im) {
  const P = { x: -S.g, y: S.G }, L = { x: 0, y: yL }, d = postDir(yL, im);
  let t = (S.xMax + 20) / d.x;
  if (S.showScreen) { const ts = S.s / d.x, ys = yL + d.y * ts; if (Math.abs(ys) <= SCREEN_H) t = ts; }
  return { P, L, E: { x: d.x * t, y: yL + d.y * t }, d };
}

function isSharp() {
  if (S.sun) return Math.abs(S.s - S.f) < 0.5;
  const im = image();
  return !im.inf && im.real && Math.abs(S.s - im.b) < Math.max(0.5, 0.025 * im.b);
}

function imageProps(im) {
  if (im.inf) return null;
  const m = Math.abs(im.B) / S.G;
  const size = m > 1.02 ? 'vergrößert' : m < 0.98 ? 'verkleinert' : 'gleich groß';
  return im.real ? { lage: 'umgekehrt', groesse: size, art: 'reell', m } : { lage: 'aufrecht', groesse: size, art: 'virtuell', m };
}

/* ---------- 3. Zeichnen ---------- */
function resize() {
  const r = $('stageWrap').getBoundingClientRect();
  DPR = window.devicePixelRatio || 1; W = r.width; H = r.height;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  render();
}
function layoutView() {
  // Ausschnitt so wählen, dass der relevante Bereich (xMin … xMax) die Fläche füllt und mittig liegt
  view.k = Math.min(W / (S.xMax - S.xMin), H / 38);
  view.cx = W / 2 - (S.xMin + S.xMax) / 2 * view.k; view.cy = H * 0.5;
}

function line(a, b, color, w = 2.5, dash = null, alpha = 1) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
  if (dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(X(a.x), Y(a.y)); ctx.lineTo(X(b.x), Y(b.y)); ctx.stroke(); ctx.restore();
}
function arrowMid(a, b, color) {   // kleine Pfeilspitze: Lichtrichtung
  const mx = (X(a.x) + X(b.x)) / 2, my = (Y(a.y) + Y(b.y)) / 2;
  const ang = Math.atan2(Y(b.y) - Y(a.y), X(b.x) - X(a.x));
  if (Math.hypot(X(b.x) - X(a.x), Y(b.y) - Y(a.y)) < 40) return;
  ctx.save(); ctx.translate(mx, my); ctx.rotate(ang); ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(7, 0); ctx.lineTo(-5, -5); ctx.lineTo(-5, 5); ctx.closePath(); ctx.fill(); ctx.restore();
}
function text(t, x, y, opt = {}) {
  ctx.save(); ctx.font = `${opt.bold ? '700 ' : ''}${opt.size || 12}px -apple-system, Segoe UI, Roboto, sans-serif`;
  ctx.fillStyle = opt.color || '#455a64'; ctx.textAlign = opt.align || 'center'; ctx.textBaseline = opt.base || 'middle';
  if (opt.bg) { const w = ctx.measureText(t).width; ctx.fillStyle = opt.bg; ctx.fillRect(x - (opt.align === 'left' ? 0 : w / 2) - 3, y - 9, w + 6, 18); ctx.fillStyle = opt.color || '#455a64'; }
  ctx.fillText(t, x, y); ctx.restore();
}

function drawCandle(c, map, xb, h, mode) {
  if (!isFinite(h) || Math.abs(h) < 0.02) return;
  const s = h < 0 ? -1 : 1, a = Math.abs(h), w = a * 0.3, top = a * 0.66;
  const P = (x, y) => map(xb + x, s * y);
  c.save(); c.lineWidth = 2; c.lineJoin = 'round';
  if (mode === 'virt') c.setLineDash([5, 4]);
  c.beginPath(); c.moveTo(...P(-w / 2, 0)); c.lineTo(...P(w / 2, 0)); c.lineTo(...P(w / 2, top)); c.lineTo(...P(-w / 2, top)); c.closePath();
  c.fillStyle = mode === 'virt' ? 'rgba(230,214,160,0.35)' : mode === 'real' ? 'rgba(236,220,170,0.92)' : '#efe0a8';
  c.strokeStyle = '#a8842c'; c.fill(); c.stroke();
  c.beginPath(); c.moveTo(...P(0, top)); c.lineTo(...P(0, top + a * 0.05)); c.strokeStyle = '#333'; c.stroke();
  const fb = top + a * 0.04, fm = fb + (a - fb) * 0.38, fw = w * 0.42;
  c.beginPath(); c.moveTo(...P(0, fb)); c.quadraticCurveTo(...P(fw * 1.6, fm), ...P(0, a)); c.quadraticCurveTo(...P(-fw * 1.6, fm), ...P(0, fb)); c.closePath();
  c.fillStyle = mode === 'virt' ? 'rgba(255,170,0,0.35)' : '#ffa726'; c.strokeStyle = '#e65100'; c.fill(); c.stroke();
  c.restore();
}

function drawAxis() {
  const x0 = (0 - view.cx) / view.k - 2, x1 = (W - view.cx) / view.k + 2;
  line({ x: x0, y: 0 }, { x: x1, y: 0 }, '#78909c', 1.5);
  ctx.save(); ctx.strokeStyle = '#90a4ae'; ctx.lineWidth = 1;
  for (let x = Math.ceil(x0); x <= x1; x++) {
    const L = x % 10 === 0 ? 7 : x % 5 === 0 ? 5 : (view.k >= 6 ? 2.5 : 0);
    if (!L) continue;
    ctx.beginPath(); ctx.moveTo(X(x), Y(0) - L); ctx.lineTo(X(x), Y(0) + L); ctx.stroke();
    if (x % 10 === 0 && x !== 0 && X(x) < W - 34) text(Math.abs(x) + '', X(x), Y(0) + 15, { size: 10, color: '#90a4ae' });
  }
  ctx.restore();
  text('cm', W - 6, Y(0) + 15, { size: 10, color: '#90a4ae', align: 'right' });
}

function drawLens() {
  const t = clamp(16 / S.f, 0.5, 2.2);
  ctx.save(); ctx.beginPath();
  if (S.lensType === 'conv') {
    ctx.moveTo(X(0), Y(A)); ctx.quadraticCurveTo(X(2 * t), Y(0), X(0), Y(-A)); ctx.quadraticCurveTo(X(-2 * t), Y(0), X(0), Y(A));
  } else {
    const e = t, c0 = 0.2;
    ctx.moveTo(X(-e), Y(A)); ctx.lineTo(X(e), Y(A)); ctx.quadraticCurveTo(X(2 * c0 - e), Y(0), X(e), Y(-A));
    ctx.lineTo(X(-e), Y(-A)); ctx.quadraticCurveTo(X(e - 2 * c0), Y(0), X(-e), Y(A));
  }
  ctx.closePath(); ctx.fillStyle = 'rgba(129,199,255,0.38)'; ctx.strokeStyle = '#3b82c4'; ctx.lineWidth = 2; ctx.fill(); ctx.stroke(); ctx.restore();
  const name = S.lensType === 'conv' ? 'Sammellinse' : 'Zerstreuungslinse';
  text(S.showF ? `${name}, f = ${fmt(S.f)} cm` : name, X(0), Y(A) - 12, { size: 12, bold: true, color: '#1e3a5f' });
}

function drawFoci() {
  const f = fSigned();
  const pts = [{ x: -f, l: 'F' }, { x: f, l: 'F′' }];
  if (S.show2F) pts.push({ x: -2 * f, l: '2F', small: true }, { x: 2 * f, l: '2F′', small: true });
  for (const p of pts) {
    if (X(p.x) < 0 || X(p.x) > W) continue;
    ctx.save(); ctx.fillStyle = p.small ? '#78909c' : '#1e3a5f';
    ctx.beginPath(); ctx.arc(X(p.x), Y(0), p.small ? 3 : 4.5, 0, 7); ctx.fill(); ctx.restore();
    text(p.l, X(p.x), Y(0) + 17, { size: p.small ? 11 : 13, bold: !p.small, color: p.small ? '#78909c' : '#1e3a5f', bg: 'rgba(246,249,252,0.85)' });
  }
}

function drawScreen() {
  const sharp = isSharp();
  ctx.save(); const w = Math.max(6, 0.6 * view.k);
  if (sharp) { ctx.shadowColor = 'rgba(22,163,74,0.8)'; ctx.shadowBlur = 14; }
  ctx.fillStyle = '#eceff1'; ctx.strokeStyle = sharp ? '#16a34a' : '#78909c'; ctx.lineWidth = 2;
  ctx.fillRect(X(S.s) - w / 2, Y(SCREEN_H), w, SCREEN_H * 2 * view.k); ctx.strokeRect(X(S.s) - w / 2, Y(SCREEN_H), w, SCREEN_H * 2 * view.k);
  ctx.restore();
  text(S.screenLabel + (S.drag.screen ? ' ⇆' : ''), X(S.s), Y(SCREEN_H) - 10, { size: 12, bold: true, color: '#37474f', bg: 'rgba(246,249,252,0.85)' });
}

function drawSun() {
  ctx.save(); const cx = X(S.xMin + 3), cy = Y(10);
  ctx.fillStyle = '#fbc02d'; ctx.beginPath(); ctx.arc(cx, cy, 13, 0, 7); ctx.fill();
  ctx.strokeStyle = '#fbc02d'; ctx.lineWidth = 2;
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * 17, cy + Math.sin(a) * 17); ctx.lineTo(cx + Math.cos(a) * 23, cy + Math.sin(a) * 23); ctx.stroke(); }
  ctx.restore();
  text('Sonnenlicht', cx + 30, cy, { align: 'left', bold: true, color: '#8d6e00' });
  for (let y = -6; y <= 6; y += 2) {
    const L = { x: 0, y }, d = norm(S.f, -y);
    let t = (S.xMax + 20) / d.x; const ts = S.s / d.x;
    if (Math.abs(y + d.y * ts) <= SCREEN_H) t = ts;
    line({ x: S.xMin - 20, y }, L, '#f9a825', 2);
    line(L, { x: d.x * t, y: y + d.y * t }, '#f9a825', 2, null, mode === 'task' ? 0.13 : 1);   // im Aufgabenmodus kaum sichtbar
    arrowMid({ x: S.xMin, y }, L, '#f9a825');
  }
  // heller Lichtfleck auf dem Papier
  const half = Math.max(0.15, 6 * Math.abs(S.s - S.f) / S.f);
  if (half < SCREEN_H) line({ x: S.s, y: half }, { x: S.s, y: -half }, 'rgba(255,193,7,0.95)', Math.max(5, 0.5 * view.k));
}

function drawRaySet(im, types, colorOf, badge) {
  types.forEach((type, i) => {
    const yL = rayYL(type); if (yL === null) return;
    const r = rayPath(yL, im), col = colorOf(type, i);
    line(r.P, r.L, col); arrowMid(r.P, r.L, col);
    line(r.L, r.E, col); arrowMid(r.L, r.E, col);
    if (S.showExt && !im.inf && !im.real) {   // gestrichelte Rückverlängerung zum virtuellen Bild
      let back = { x: im.b, y: im.B };
      if (type === 'par' && S.lensType === 'div') back = { x: fSigned(), y: 0 };
      line(r.L, back, col, 1.6, [6, 5], 0.8);
    }
    if (S.showExt && type === 'foc') {          // Hilfslinien zum Brennpunkt F
      const Fo = { x: -fSigned(), y: 0 };
      if (S.lensType === 'conv' && S.g < S.f) line(Fo, r.P, col, 1.4, [2, 5], 0.8);
      if (S.lensType === 'div') line(r.L, Fo, col, 1.4, [2, 5], 0.8);
    }
    if (badge) {
      const t = 0.25 + 0.22 * i, bp = { x: r.P.x + (r.L.x - r.P.x) * t, y: r.P.y + (r.L.y - r.P.y) * t };
      const q = { x: 3 + 4 * i, y: yL + r.d.y / r.d.x * (3 + 4 * i) };
      [bp, q].forEach(p => { ctx.save(); ctx.fillStyle = col; ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), 11, 0, 7); ctx.fill(); ctx.restore(); text(String(i + 1), X(p.x), Y(p.y) + 0.5, { color: '#fff', bold: true, size: 13 }); });
    }
  });
}

function drawBundle(im) {
  for (let i = 0; i <= 8; i++) {
    const yL = -A * 0.9 + i * (A * 1.8 / 8), r = rayPath(yL, im);
    line(r.P, r.L, COL.bundle, 1.5); line(r.L, r.E, COL.bundle, 1.5);
  }
}

function drawDims(im) {
  const row = (x1, x2, y, label, col) => {
    if (Math.abs(x2 - x1) < 0.3) return;
    line({ x: x1, y }, { x: x2, y }, col, 1.3);
    [x1, x2].forEach(x => line({ x, y: y - 0.5 }, { x, y: y + 0.5 }, col, 1.3));
    text(label, X((x1 + x2) / 2), Y(y), { size: 12, bold: true, color: col, bg: 'rgba(246,249,252,0.92)' });
  };
  if (!S.sun) row(-S.g, 0, -(A + 2.5), `g = ${fmt(S.g)} cm`, '#5d4037');
  if (S.showImage && !S.sun && !im.inf && im.b > S.xMin - 10 && im.b < S.xMax + 10) row(0, clamp(im.b, S.xMin - 8, S.xMax + 8), -(A + 5), `b = ${fmt(Math.abs(im.b))} cm${im.real ? '' : ' (virtuell)'}`, '#6a1b9a');
}

function drawUserLines() {
  for (const l of S.lines) {
    if (l.kind === 'pre') line({ x: l.x0, y: l.y0 }, { x: 0, y: l.y }, COL.pencil, 2.6);
    else if (l.kind === 'post') line({ x: 0, y: l.y }, { x: l.dx * 200, y: l.y + l.dy * 200 }, COL.pencil, 2.6);
    else if (l.kind === 'ext') line({ x: 0, y: l.y }, { x: l.x2, y: l.y2 }, COL.pencil, 2, [7, 5]);
    else line({ x: l.x1, y: l.y1 }, { x: l.x2, y: l.y2 }, '#90a4ae', 2);
  }
  if (drag && drag.kind === 'line') line(drag.start, drag.cur, '#546e7a', 1.5, [4, 4]);
}

function drawMark() {
  const p = S.imgMark; ctx.save(); ctx.strokeStyle = '#d81b60'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(X(p.x) - 9, Y(p.y) - 9); ctx.lineTo(X(p.x) + 9, Y(p.y) + 9); ctx.moveTo(X(p.x) + 9, Y(p.y) - 9); ctx.lineTo(X(p.x) - 9, Y(p.y) + 9); ctx.stroke(); ctx.restore();
  text('Bildpunkt', X(p.x), Y(p.y) - 18, { size: 11, bold: true, color: '#d81b60', bg: 'rgba(246,249,252,0.85)' });
}

function draw() {
  if (!W) return; layoutView();
  ctx.clearRect(0, 0, W, H); ctx.fillStyle = '#f6f9fc'; ctx.fillRect(0, 0, W, H);
  drawAxis();
  if (S.construct) { line({ x: 0, y: A + 4 }, { x: 0, y: -A - 4 }, '#90a4ae', 1.2, [5, 5]); text('Mittelebene', X(0) + 6, Y(-A - 3.5), { align: 'left', size: 11, color: '#78909c' }); }
  drawLens();
  if (S.showF) drawFoci();
  if (S.showScreen) drawScreen();
  const im = image();
  if (S.sun) drawSun();
  else {
    if (S.bundle) drawBundle(im);
    if (S.neutral) drawRaySet(im, S.neutral.order, (t, i) => NEUTRAL[i], true);
    else drawRaySet(im, ['par', 'cen', 'foc'].filter(t => S.rays[t]), t => COL[t], false);
    if (S.showImage && !im.inf) drawCandle(ctx, MAP, im.b, im.B, im.real ? 'real' : 'virt');
    drawCandle(ctx, MAP, -S.g, S.G, 'obj');
    const tip = { x: -S.g, y: S.G };
    if (S.drag.objH) { ctx.save(); ctx.fillStyle = '#fff'; ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(X(tip.x), Y(tip.y), 9, 0, 7); ctx.fill(); ctx.stroke(); ctx.restore(); text('↕', X(tip.x), Y(tip.y) + 1, { size: 11, bold: true, color: '#2563eb' }); }
    if (S.drag.obj) text('⇆', X(-S.g), Y(0) + 26, { size: 15, bold: true, color: '#2563eb' });
    if (S.construct) { ctx.save(); ctx.fillStyle = '#d81b60'; ctx.beginPath(); ctx.arc(X(tip.x), Y(tip.y), 4.5, 0, 7); ctx.fill(); ctx.restore(); }
  }
  drawUserLines();
  if (S.imgMark) drawMark();
  if (mode === 'task' && cur && cur.hints >= 3 && cur.lv.ghost) { ctx.save(); cur.lv.ghost(cur, im); ctx.restore(); }
  if (S.showDims) drawDims(im);
}
const ghostLine = (a, b) => line(a, b, COL.ghost, 2.2, [3, 6], 0.75);
function ghostCircle(p) { ctx.save(); ctx.strokeStyle = COL.ghost; ctx.lineWidth = 2.5; ctx.setLineDash([3, 4]); ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), 14, 0, 7); ctx.stroke(); ctx.restore(); }

/* Schirmansicht: was man auf dem Schirm sieht (Unschärfe per CSS-Filter, funktioniert auch in Safari) */
function drawScreenView() {
  const c = $('scrView'); if (!c) return;
  const lab = $('scrLabel'), w = c.clientWidth, h = c.clientHeight; if (!w || !h) return;
  if (c.width !== Math.round(w * DPR)) { c.width = Math.round(w * DPR); c.height = Math.round(h * DPR); }
  const x = c.getContext('2d'); x.setTransform(DPR, 0, 0, DPR, 0, 0);
  x.fillStyle = '#f5f5f0'; x.fillRect(0, 0, w, h);
  const sc = h / (2 * SCREEN_H) * 0.95, map = (px, py) => [w / 2 + px * sc, h / 2 - py * sc];
  const say = (t) => { x.fillStyle = '#78909c'; x.font = '600 13px -apple-system, sans-serif'; x.textAlign = 'center'; x.fillText(t, w / 2, h / 2); };
  c.style.filter = 'none';
  if (!S.showScreen) { x.fillStyle = '#263238'; x.fillRect(0, 0, w, h); lab.textContent = 'Schirm ist ausgeblendet.'; return; }
  if (S.sun) {
    const d = 2 * 6 * Math.abs(S.s - S.f) / S.f + 0.12, r = Math.max(2, d / 2 * sc);
    const gr = x.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, r);
    const I = clamp(1.2 / (d * d), 0.15, 1);
    gr.addColorStop(0, `rgba(255,200,0,${I})`); gr.addColorStop(1, `rgba(255,220,80,${I * 0.5})`);
    x.fillStyle = gr; x.beginPath(); x.arc(w / 2, h / 2, r, 0, 7); x.fill();
    lab.textContent = isSharp() ? '🔥 Winziger, heller Lichtfleck – hier könnte das Papier zu brennen beginnen!' : `Lichtfleck: Durchmesser etwa ${fmt(d)} cm`;
    return;
  }
  const im = image();
  if (im.inf) { say('Kein Bild – nur ein heller Fleck'); lab.textContent = 'Kerze im Brennpunkt: Die Strahlen verlaufen hinter der Linse parallel. Es entsteht kein Bild.'; return; }
  if (!im.real) { say('Kein Bild auf dem Schirm'); lab.textContent = 'Virtuelles Bild: Man kann es nicht auf einem Schirm auffangen. Man sieht es nur, wenn man durch die Linse schaut.'; return; }
  const hs = im.B * S.s / im.b;                         // Bildhöhe am Ort des Schirms (Mittelpunktstrahl)
  const spot = 2 * A * 0.5 * Math.abs(S.s - im.b) / im.b; // Durchmesser der Unschärfe (cm)
  drawCandle(x, map, 0, hs, 'real');
  const blur = Math.min(14, spot * sc * 0.5);
  if (blur > 0.4) c.style.filter = `blur(${blur.toFixed(1)}px)`;
  lab.innerHTML = isSharp() ? '✅ <b>Scharfes Bild</b>' : (S.s < im.b ? 'Unscharf – das Bild entsteht <b>weiter hinten</b>.' : 'Unscharf – das Bild entsteht <b>weiter vorne</b>.');
  if (mode === 'task' && cur && cur.lv.hideScrHelp && !isSharp()) lab.textContent = 'Unscharf – verschiebe die Leinwand.';
}

function render() { draw(); drawScreenView(); updateLive(); }

/* ---------- 4. Bedienung ---------- */
let drag = null;
function toWorld(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left - view.cx) / view.k, y: (view.cy - (e.clientY - r.top)) / view.k }; }
function hitTest(p) {
  const k = view.k;
  if (!S.sun) {
    const tip = { x: -S.g, y: S.G };
    if (S.drag.objH && dist(p, tip) * k < 26) return 'objH';
    if (S.drag.obj) { const half = Math.max(26, S.G * 0.15 * k + 14); if (Math.abs(p.x + S.g) * k < half && p.y > -2.5 && p.y < S.G + 1) return 'obj'; }
  }
  if (S.showScreen && S.drag.screen && Math.abs(p.x - S.s) * k < 28 && Math.abs(p.y) < SCREEN_H + 2) return 'screen';
  if (S.construct) return S.tool === 'point' ? 'mark' : 'line';
  return null;
}
cv.addEventListener('pointerdown', e => {
  if (drag) return;
  const p = toWorld(e), kind = hitTest(p); if (!kind) return;
  e.preventDefault();
  drag = { kind, id: e.pointerId, start: p, cur: p, off: kind === 'obj' ? -S.g - p.x : kind === 'screen' ? S.s - p.x : 0 };
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  if (kind === 'mark') { S.imgMark = p; render(); }
});
cv.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const p = toWorld(e); drag.cur = p;
  if (drag.kind === 'obj') S.g = clamp(Math.round(-(p.x + drag.off) * 2) / 2, 1, -S.xMin - 2);
  else if (drag.kind === 'objH') S.G = clamp(Math.round(p.y * 2) / 2, 1, 9);
  else if (drag.kind === 'screen') S.s = clamp(Math.round((p.x + drag.off) * 4) / 4, 1, S.xMax - 1);
  else if (drag.kind === 'mark') S.imgMark = p;
  render();
});
function endDrag(e) {
  if (!drag || e.pointerId !== drag.id) return;
  if (drag.kind === 'line' && e.type === 'pointerup') processLine(drag.start, drag.cur);
  drag = null; render();
}
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

/* Gezeichnete Linie auswerten. Wie ein Geodreieck rastet sie an wichtigen Punkten und Richtungen ein
   (Spitze der Kerze, Mittelebene, parallel zur Achse, durch F/F′). Die Regel muss man trotzdem kennen. */
function processLine(a, b) {
  const k = view.k, snap = 20 / k, P = { x: -S.g, y: S.G }, f = fSigned(), im = image();
  if (dist(a, b) * k < 14) return;
  const autoTypes = (!S.neutral && !S.sun) ? ['par', 'cen', 'foc'].filter(t => S.rays[t]) : [];
  const lensPts = S.lines.filter(l => l.kind === 'pre').map(l => l.y).concat(autoTypes.map(rayYL).filter(v => v !== null));
  let s = { ...a }, atP = false;
  if (dist(a, P) < snap) { s = { ...P }; atP = true; }
  else if (Math.abs(a.x) * k < 18) { s.x = 0; for (const y of lensPts) if (Math.abs(a.y - y) < snap) { s.y = y; break; } }

  if (s.x < -0.3 && b.x > s.x + 0.5 && b.x > -1.2) {          // Strahl vor der Linse
    let yL = s.y + (b.y - s.y) * (0 - s.x) / (b.x - s.x);
    if (atP) {
      const cands = [S.G, 0, rayYL('foc')].filter(v => v !== null);
      let bestC = null, bd = 16 / k;
      for (const c of cands) if (Math.abs(yL - c) < bd) { bd = Math.abs(yL - c); bestC = c; }
      if (bestC !== null) yL = bestC;
    }
    S.lines.push({ kind: 'pre', x0: s.x, y0: s.y, y: yL, fromP: atP });
  } else if (s.x === 0 && b.x > 0.3) {                          // Strahl nach der Linse
    let d = norm(b.x, b.y - s.y);
    const cands = [{ x: 1, y: 0 }];
    if (Math.abs(f) > 0.1) cands.push(f > 0 ? norm(f, -s.y) : norm(-f, s.y));
    S.lines.filter(l => l.kind === 'pre' && Math.abs(l.y - s.y) < 1e-6).forEach(l => cands.push(norm(-l.x0, s.y - l.y0)));
    let bestD = null, ba = 4.5;
    for (const c of cands) { const an = angDeg(d, c); if (an < ba) { ba = an; bestD = c; } }
    if (bestD) d = bestD;
    S.lines.push({ kind: 'post', y: s.y, dx: d.x, dy: d.y });
  } else if (s.x === 0 && b.x < -0.3) {                         // gestrichelte Rückverlängerung
    let d = norm(b.x, b.y - s.y);
    const cands = S.lines.filter(l => l.kind === 'post' && Math.abs(l.y - s.y) < 1e-6).map(l => ({ x: -l.dx, y: -l.dy }));
    autoTypes.forEach(t => { const y = rayYL(t); if (y !== null && Math.abs(y - s.y) < 1e-6) { const pd = postDir(y, im); cands.push({ x: -pd.x, y: -pd.y }); } });
    for (const c of cands) if (angDeg(d, c) < 5) { d = c; break; }
    const len = Math.max(dist(s, b), 5) / Math.abs(d.x) * Math.abs(d.x);
    S.lines.push({ kind: 'ext', y: s.y, x2: d.x * len * 1.4, y2: s.y + d.y * len * 1.4 });
  } else {
    S.lines.push({ kind: 'free', x1: s.x, y1: s.y, x2: b.x, y2: b.y });
  }
}

// Prüft die selbst gezeichneten Hauptstrahlen
function evalConstruction() {
  const f = fSigned(), G = S.G, Fp = { x: f, y: 0 };
  const res = { par: false, cen: false, foc: false }, msgs = [];
  const pres = S.lines.filter(l => l.kind === 'pre');
  if (!pres.length) msgs.push('Zeichne zuerst einen Strahl: von der Flammenspitze bis zur Mittelebene der Linse.');
  for (const pre of pres) {
    if (!pre.fromP) { msgs.push('Jeder Strahl muss an der Flammenspitze (roter Punkt) beginnen.'); continue; }
    let type = null; const yF = rayYL('foc');
    if (Math.abs(pre.y - G) < 0.25) type = 'par';
    else if (Math.abs(pre.y) < 0.25) type = 'cen';
    else if (yF !== null && Math.abs(pre.y - yF) < 0.25) type = 'foc';
    if (!type) { msgs.push('Ein Strahl vor der Linse ist kein Hauptstrahl. Hauptstrahlen verlaufen parallel zur Achse, durch die Linsenmitte oder durch F.'); continue; }
    const post = S.lines.find(l => l.kind === 'post' && Math.abs(l.y - pre.y) < 0.25);
    if (!post) { msgs.push(`Beim ${NAME[type]} fehlt noch der Teil nach der Linse. Setze an dem Punkt an, an dem er die Mittelebene trifft.`); continue; }
    let ok = false;
    if (type === 'par') ok = distPointLine(Fp, { x: 0, y: post.y }, { x: post.dx, y: post.dy }) < 0.35;
    if (type === 'cen') ok = angDeg(norm(-pre.x0, pre.y - pre.y0), { x: post.dx, y: post.dy }) < 2;
    if (type === 'foc') ok = Math.abs(post.dy) < 0.03;
    if (ok) res[type] = true;
    else msgs.push({
      par: S.lensType === 'div' ? 'Der Parallelstrahl wird nach außen abgelenkt – so, dass seine Verlängerung nach hinten durch F′ vor der Linse geht.' : 'Der Parallelstrahl muss nach der Linse durch den Brennpunkt F′ gehen.',
      cen: 'Der Mittelpunktstrahl geht ohne Knick geradeaus durch die Linsenmitte.',
      foc: 'Der Brennpunktstrahl verläuft nach der Linse parallel zur optischen Achse.'
    }[type]);
  }
  return { res, msgs, count: Object.values(res).filter(Boolean).length };
}
const tolImg = cm => Math.max(cm, 18 / view.k);

/* ---------- 5. Experimentiermodus ---------- */

  </div>

  <h3>Messwerte</h3>

  <div class="row" style="margin-top:12px"><button class="btn" data-act="resetExp">↺ Alles zurücksetzen</button></div>`;
  $('sF').addEventListener('input', e => { S.f = +e.target.value; $('oF').textContent = fmt(S.f) + ' cm'; render(); });
  $('sG').addEventListener('input', e => { S.G = +e.target.value; $('oG').textContent = fmt(S.G) + ' cm'; render(); });
}

function measTable(rows) { return `<table class="meas">${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>`; }
function tagsHTML(pr) { return pr ? `<div class="tags"><span class="tag">${pr.art}</span><span class="tag">${pr.lage}</span><span class="tag">${pr.groesse}</span></div>` : `<div class="tags"><span class="tag warn">kein Bild – Strahlen parallel</span></div>`; }

function updateLive() {
  const im = image(), pr = imageProps(im);
  const el = $('measExp');
  if (el) {
    el.innerHTML = measTable([
      ['Gegenstandsweite g', fmt(S.g) + ' cm'],
      ['Bildweite b', im.inf ? '∞' : fmt(Math.abs(im.b)) + ' cm' + (im.real ? '' : ' (virtuell)')],
      ['Brennweite f', fmt(S.f) + ' cm'],
      ['Gegenstandsgröße G', fmt(S.G) + ' cm'],
      ['Bildgröße B', im.inf ? '—' : fmt(Math.abs(im.B)) + ' cm'],
      ['Abbildungsmaßstab B : G', im.inf ? '—' : fmt(pr.m, 2) + ' : 1']
    ]) + tagsHTML(pr);
    const oG = $('oG'), sG = $('sG'); if (oG && +sG.value !== S.G) { sG.value = S.G; oG.textContent = fmt(S.G) + ' cm'; }
  }
  const el2 = $('measScreen');   // Level 7/8: Messen wie im echten Experiment (b wird nicht verraten)
  if (el2) {
    const hs = (!im.inf && im.real) ? Math.abs(im.B * S.s / im.b) : null;
    el2.innerHTML = measTable([
      ['Gegenstandsweite g', fmt(S.g) + ' cm'], ['Abstand Linse – Schirm', fmt(S.s) + ' cm'],
      ['Gegenstandsgröße G', fmt(S.G) + ' cm'], ['Bildgröße auf dem Schirm', hs === null ? 'kein Bild' : (isSharp() ? fmt(hs) + ' cm' : 'unscharf')]
    ]);
  }
  const el3 = $('measLupe');
  if (el3) el3.innerHTML = measTable([['Gegenstandsweite g', fmt(S.g) + ' cm'], ['Brennweite f', fmt(S.f) + ' cm'], ['Vergrößerung', (!im.inf && !im.real) ? fmt(pr.m) + '-fach' : '—']]) + tagsHTML(pr);
}

      }
      if (!S.imgMark) return { neutral: true, msg: 'Wähle 📍 Bildpunkt und tippe auf die Stelle, an der sich die Verlängerungen schneiden.' };
      if (dist(S.imgMark, { x: im.b, y: im.B }) < tolImg(1.0)) return { ok: true, msg: 'Genau! Die Strahlen laufen nach der Lupe auseinander. Das Auge verfolgt sie geradlinig zurück und sieht ein <b>virtuelles, aufrechtes, vergrößertes</b> Bild – auf derselben Seite wie die Briefmarke.' };
      return { msg: 'Noch nicht. Die Strahlen laufen nach der Linse auseinander. Verlängere beide nach <b>links</b>: Wo schneiden sich die Verlängerungen?' };
    },
    onSuccess() { S.showImage = true; S.showExt = true; },
    hints: ['Bei einer Lupe ist der Gegenstand <b>näher an der Linse</b> als der Brennpunkt F (g &lt; f).',
      'Teil 1: Je näher die Kerze an F heranrückt, desto stärker die Vergrößerung. Teil 2: Lege den Finger auf den Knickpunkt eines Strahls an der Linse und ziehe nach <b>links</b>. So entsteht eine gestrichelte Verlängerung.',
      'Teillösung: Teil 1 klappt zum Beispiel mit g = 6 cm. In Teil 2 ist die Verlängerung des Parallelstrahls lila gepunktet vorgezeichnet.'],
    ghost(c, im) { if (c.data.part === 2 && !im.inf && !im.real) { const d = postDir(S.G, im); ghostLine({ x: 0, y: S.G }, { x: im.b * 1.15, y: S.G + d.y / d.x * im.b * 1.15 }); } }
  },
  { // 10
    title: 'Brille für Kurzsichtige', icon: '👓', extra: true,
    ctx: 'Kurzsichtige Menschen tragen Brillen mit <b>Zerstreuungslinsen</b>. Bei ihnen liegt der Brennpunkt F′ <b>vor</b> der Linse, auf der Seite des Gegenstands.',
    task: 'Zeichne <b>Parallelstrahl</b> und <b>Mittelpunktstrahl</b> und ihre gestrichelten Verlängerungen nach links. Setze dann mit 📍 den Bildpunkt.',
    setup: () => ({ lensType: 'div', f: 8, g: 16, G: 6, construct: true, rays: { par: false, cen: false, foc: false }, showImage: false, showScreen: false, drag: NOFREE, xMin: -20, xMax: 14, showDims: false, show2F: false }),
    panel: () => toolsHTML(true),
    check() {
      const ev = evalConstruction(), im = image();
      if (!S.lines.length) return { neutral: true, msg: 'Zeichne zuerst den Parallel- und den Mittelpunktstrahl.' };
      if (!(ev.res.par && ev.res.cen)) return { msg: ev.msgs[0] || 'Es fehlt noch ein Strahl.' };
      if (!S.imgMark) return { neutral: true, msg: 'Die Strahlen stimmen! Verlängere sie nach links und setze mit 📍 den Bildpunkt.' };
      if (dist(S.imgMark, { x: im.b, y: im.B }) < tolImg(0.7)) return { ok: true, msg: 'Super! Die Zerstreuungslinse erzeugt immer ein <b>virtuelles, aufrechtes und verkleinertes</b> Bild. Es liegt zwischen F′ und der Linse.' };
      return { msg: 'Der Bildpunkt liegt noch nicht am Schnittpunkt der gestrichelten Verlängerungen.' };
    },
    onSuccess() { S.showImage = true; S.showExt = true; },
    hints: ['Eine Zerstreuungslinse lenkt Strahlen <b>von der Achse weg</b>. Die Strahlen laufen nach der Linse auseinander.',
      'Parallelstrahl: nach der Linse so schräg nach oben, als käme er aus <b>F′ (links)</b>. Mittelpunktstrahl: ohne Knick. Das Bild liegt dort, wo sich die <b>Verlängerungen nach links</b> schneiden.',
      'Teillösung: Der lila gepunktete Strahl zeigt dir den Parallelstrahl samt Verlängerung bis F′.'],
    ghost(c, im) { const r = rayPath(S.G, im); ghostLine(r.P, r.L); ghostLine(r.L, r.E); ghostLine(r.L, { x: fSigned(), y: 0 }); ghostCircle({ x: fSigned(), y: 0 }); }
  }
];

const starStr = (n, cls = '') => [1, 2, 3].map(i => i <= n ? `<span>★</span>` : `<span><i>★</i></span>`).join('');
const stars = c => Math.max(1, 3 - c.hints - (c.lv.errPen ? Math.min(2, c.wrong) : (c.wrong > 0 ? 1 : 0)));
function updateTotal() { $('starTotal').textContent = `⭐ ${best.reduce((a, b) => a + (b || 0), 0)} / ${LEVELS.length * 3}`; }

function showGrid() {
  mode = 'task'; cur = null; S = { ...defaultState(), rays: { par: true, cen: true, foc: false }, showScreen: false };
  const g = $('levelGrid');
  g.innerHTML = `<h2>⭐ Aufgaben – wähle ein Level</h2><div class="grid">${LEVELS.map((lv, i) => `<button class="card ${lv.extra ? 'extra' : ''}" data-act="start" data-i="${i}"><span class="ico">${lv.icon}</span><span class="num">Level ${i + 1}${lv.extra ? ' <span class="xtra">· ZUSATZ</span>' : ''}</span><span class="ttl">${lv.title}</span><span class="st">${[1, 2, 3].map(k => k <= (best[i] || 0) ? '★' : '<i>★</i>').join('')}</span></button>`).join('')}</div>`;
  g.classList.add('show');
  panel.innerHTML = `<h2>So funktioniert's</h2>
    <p>Die Level bauen aufeinander auf: Zuerst lernst du die Hauptstrahlen kennen, dann konstruierst du Bilder und stellst am Ende echte Geräte ein.</p>
    <div class="context"><b>⭐ Sterne:</b> Ohne Hinweis und ohne Fehlversuch bekommst du 3 Sterne. Jeder Hinweis und ein Fehlversuch kostet einen Stern. Mindestens 1 Stern gibt es immer.</div>
    <div class="hint"><b>💡 Hinweise</b> gibt es in drei Stufen: Denkanstoß → Strategie → Teillösung. Nutze sie, wenn du nicht weiterkommst!</div>
    <p class="small">Level 10 ist eine Zusatzaufgabe zur Zerstreuungslinse.<br>Hinweis: Fortschritt und Sterne werden nicht gespeichert und sind nach dem Neuladen weg.</p>`;
  render();
}

function startLevel(i) {
  const lv = LEVELS[i];
  S = { ...defaultState(), ...lv.setup() }; S.drag = { ...S.drag }; S.rays = { ...S.rays };
  cur = { idx: i, lv, hints: 0, wrong: 0, data: {}, fb: null };
  lv.init && lv.init.call(lv, cur);
  $('levelGrid').classList.remove('show');
  renderTaskPanel(); render();
}

function renderTaskPanel() {
  const c = cur, lv = c.lv, task = typeof lv.task === 'function' ? lv.task(c) : lv.task;
  const st = stars(c);
  panel.innerHTML = `
    <div class="lvhead"><button class="btn" data-act="grid">← Übersicht</button><span class="small">Level ${c.idx + 1} von ${LEVELS.length}${lv.extra ? ' · Zusatz' : ''}</span></div>
    <h2>${lv.icon} ${lv.title}</h2>
    <div class="context">${lv.ctx}</div>
    <div class="task"><b>Aufgabe:</b> ${task}</div>
    ${lv.panel ? lv.panel.call(lv, c) : ''}
    ${c.hints ? `<div class="hints">${lv.hints.slice(0, c.hints).map((h, i) => `<div class="hint"><b>Hinweis ${i + 1}:</b> ${h}</div>`).join('')}</div>` : ''}
    <div class="actions">
      <div id="feedback" class="feedback ${c.fb ? 'show ' + c.fb.cls : ''}">${c.fb ? c.fb.msg : ''}</div>
      <div class="actrow">
        ${lv.footerBtn ? lv.footerBtn.call(lv, c) : '<button class="btn primary" data-act="check">✔ Prüfen</button>'}
        <button class="btn hintbtn" data-act="hint" ${c.hints >= 3 ? 'disabled' : ''}>💡 Hinweis${c.hints < 3 ? ` ${c.hints + 1}/3` : 'e genutzt'}</button>
      </div>
      <div class="starline">Mögliche Sterne: <span class="st">${[1, 2, 3].map(k => k <= st ? '★' : '<i>★</i>').join('')}</span></div>
    </div>`;
  updateLive(); drawScreenView();
}

function setFeedback(msg, cls, silent) {
  cur.fb = { msg, cls }; const el = $('feedback');
  if (el) { el.className = 'feedback show ' + cls; el.innerHTML = msg; }
  if (!silent) renderTaskPanel();
}

function doCheck() {
  const r = cur.lv.check.call(cur.lv, cur);
  if (r.ok) { finish(r.msg); return; }
  if (!r.neutral) cur.wrong++;
  cur.fb = { msg: r.msg, cls: r.cls || (r.neutral ? 'info' : 'bad') };
  renderTaskPanel(); render();
}

function finish(msg) {
  const st = stars(cur);
  best[cur.idx] = Math.max(best[cur.idx] || 0, st); updateTotal();
  cur.lv.onSuccess && cur.lv.onSuccess(cur);
  cur.fb = { msg: '✅ ' + msg, cls: 'good' }; renderTaskPanel(); render();
  const next = cur.idx < LEVELS.length - 1;
  $('modal').innerHTML = `<div class="bigstars">${starStr(st)}</div><h2>Level ${cur.idx + 1} geschafft!</h2><p>${msg}</p>
    <p class="small">${cur.hints ? `Genutzte Hinweise: ${cur.hints}. ` : ''}${cur.wrong ? `Fehlversuche: ${cur.wrong}.` : ''}${!cur.hints && !cur.wrong ? 'Ohne Hilfe gelöst – stark!' : ''}</p>
    <div class="row"><button class="btn" data-act="mClose">👀 Ansehen</button><button class="btn" data-act="mAgain">🔁 Nochmal</button></div>
    <div class="row">${next ? `<button class="btn primary" data-act="mNext">➡ Nächstes Level</button>` : `<button class="btn primary" data-act="mGrid">🏁 Zur Übersicht</button>`}</div>`;
  $('overlay').classList.add('show');
}

function setMode(m) {
  $('tabExp').classList.toggle('active', m === 'exp'); $('tabTask').classList.toggle('active', m === 'task');
  if (m === 'exp') { mode = 'exp'; cur = null; S = defaultState(); $('levelGrid').classList.remove('show'); renderExpPanel(); render(); }
  else showGrid();
}

/* Zentrale Klick-Verteilung (Event-Delegation) */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a = el.dataset.act, v = el.dataset.v;
  if (cur && cur.lv.act && cur.lv.act.call(cur.lv, a, el, cur)) return;
  switch (a) {
    case 'modeExp': setMode('exp'); break;
    case 'modeTask': setMode('task'); break;
    case 'lens': S.lensType = v; renderExpPanel(); render(); break;
    case 'ray': S.rays[v] = !S.rays[v]; el.classList.toggle('on', S.rays[v]); render(); break;
    case 'opt': S[v] = !S[v]; el.classList.toggle('on', S[v]); render(); break;
    case 'preset': {
      S.g = clamp(Math.round(S.f * +v * 2) / 2, 1, -S.xMin - 2); if (+v === 1) S.g = S.f;
      const im = image(); if (!im.inf && im.real && im.b < S.xMax - 1) S.s = Math.round(im.b * 4) / 4;
      render(); break;
    }
    case 'resetExp': S = defaultState(); renderExpPanel(); render(); break;
    case 'start': startLevel(+el.dataset.i); break;
    case 'grid': showGrid(); break;
    case 'check': doCheck(); break;
    case 'hint':
      if (cur.hints < 3) {
        cur.hints++; cur.lv.onHint && cur.lv.onHint(cur.hints, cur); renderTaskPanel(); render();
        const hs = panel.querySelectorAll('.hint'); if (hs.length) hs[hs.length - 1].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
      break;
    case 'tool': S.tool = v; document.querySelectorAll('[data-act="tool"]').forEach(b => b.classList.toggle('on', b.dataset.v === v)); break;
    case 'undo': S.lines.pop(); render(); break;
    case 'clear': S.lines = []; S.imgMark = null; render(); break;
    case 'mClose': $('overlay').classList.remove('show'); break;
    case 'mAgain': $('overlay').classList.remove('show'); startLevel(cur.idx); break;
    case 'mNext': $('overlay').classList.remove('show'); startLevel(cur.idx + 1); break;
    case 'mGrid': $('overlay').classList.remove('show'); showGrid(); break;
  }
});

// Ältere iPad-Safari-Versionen kennen kein 100dvh: Höhe an das sichtbare Fenster anpassen
const fitBody = () => { document.body.style.height = window.innerHeight + 'px'; };
window.addEventListener('resize', fitBody); fitBody();
new ResizeObserver(() => resize()).observe($('stageWrap'));
window.addEventListener('orientationchange', () => setTimeout(() => { fitBody(); resize(); }, 250));
document.addEventListener('gesturestart', e => e.preventDefault());   // iPad: Pinch-Zoom verhindern
updateTotal(); setMode('exp');
</script>
</body>
</html>
